[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nebulax-models"
version = "0.1.0"
description = "Reproducible baselines for NebulaX Problem Statement 3"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "openpyxl>=3.1,<4",
  "joblib>=1.3,<2",
]

[tool.setuptools.packages.find]
include = ["nebulax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

